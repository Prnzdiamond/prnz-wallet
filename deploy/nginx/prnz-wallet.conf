server {
    listen 80;
    listen [::]:80;
    server_name prnz-wallet.duckdns.org;

    root /var/www/prnz-wallet/backend/public;
    index index.php;

    access_log /var/log/nginx/prnz-wallet-access.log;
    error_log /var/log/nginx/prnz-wallet-error.log;

    client_max_body_size 1m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass unix:/run/php/prnz-wallet.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 30s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
